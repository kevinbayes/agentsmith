[package]
name = "agentsmith-engineers"
version = "0.1.0"
edition = "2021"

[dependencies]
agentsmith-common = { path = "../agentsmith-common"}
agentsmith-agent = { path = "../agentsmith-agent"}

ratatui="0.29"
clap= { version = "4.5", features = ["cargo"] }
log = "0.4"
minijinja = { version = "2", features = ["loader"] }
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
strum_macros = "0.26"
uuid = { version = "1.10.0", features = ["v4"] }
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1.83"
regex = "1.11"
