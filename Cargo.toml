[workspace]
resolver = "2"
members = [
    "agentsmith-core",
    "agentsmith-llm",
    "agentsmith-tools",
    "agentsmith-mcp",
    "agentsmith-runtime",
    "agentsmith-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
agentsmith-core = { path = "agentsmith-core" }
agentsmith-llm = { path = "agentsmith-llm" }
agentsmith-mcp = { path = "agentsmith-mcp" }
agentsmith-runtime = { path = "agentsmith-runtime" }
agentsmith-tools = { path = "agentsmith-tools" }
rmcp = { version = "=3.6.0", default-features = false, features = ["client", "transport-child-process"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
gethostname = "1"
libc = "0.2"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v7"] }
