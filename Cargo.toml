[workspace]
resolver = "2"
members = ["agentsmith-core", "agentsmith-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
agentsmith-core = { path = "agentsmith-core" }
clap = { version = "4", features = ["derive"] }
gethostname = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
url = "2"
uuid = { version = "1", features = ["v7"] }
